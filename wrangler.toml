name = "jonny-hq-passes"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# passes.jonny.to -> this Worker.
# Keeps the PassKit /v1/* paths off the apex domain that serves the site.
routes = [
  { pattern = "passes.jonny.to", custom_domain = true }
]

# Bundles template/*.png into the Worker as ArrayBuffers.
[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "passes"
database_id = "35d7cac0-b4cc-4233-8f8f-aa34ddf8fa9b"

[vars]
PASS_TYPE_IDENTIFIER = "pass.to.jonny"
TEAM_IDENTIFIER = "9YYR8HYVP6"
WEB_SERVICE_URL = "https://passes.jonny.to/"
APNS_HOST = "api.push.apple.com"
SHARED_SERIAL_NUMBER = "0001"

# Secrets (set with `wrangler secret put <NAME>`):
#   PASS_CERT_P12_BASE64  - base64 of the Pass Type ID .p12
#   PASS_CERT_P12_PASSWORD- password used when exporting the .p12
#   WWDR_CERT_PEM         - Apple WWDR G4 intermediate, PEM text
#   APNS_KEY_P8           - contents of AuthKey_XXXXXXXX.p8
#   APNS_KEY_ID           - the 10-char key ID
#   ADMIN_TOKEN           - bearer token guarding /admin/* and /send
